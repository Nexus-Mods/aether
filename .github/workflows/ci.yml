# Builds and tests Aether on every push and pull request: the whole workspace
# on Windows, where all of it builds and runs, and the portable crates plus the
# cross-build of the Windows natives on Linux.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # The large caches (rust-cache's target dirs, cargo-xwin's MSVC CRT) are
  # saved from master only, so branches restore them and never crowd them out.
  SAVE_LARGE_CACHES: ${{ github.ref == 'refs/heads/master' }}

jobs:
  # Format, lint, the artifacts the tests inject, every test, the 32-bit
  # injector's unit tests, and the release build of the natives with the
  # VC++ runtime import check.
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    # The runner's default TMP is under C:\Users\RUNNER~1\... (`runneradmin`
    # exceeds eight characters, so its profile has an 8.3 alias), and every
    # path from `std::env::temp_dir()` carries that alias. A root declared in
    # short form matches only short paths, so tests rooted there fail, while
    # passing on any machine whose user name fits 8.3. Production paths are
    # long-form, and fixing it in `RootMap` was tried and reverted (the
    # `#[ignore]`d `a_root_declared_in_8dot3_form_recognises_its_long_form_paths`
    # in aether-redirect records why). So the runner's TMP is corrected instead:
    # `vfstmp` fits 8.3 and has no alias.
    env:
      TMP: C:\vfstmp
      TEMP: C:\vfstmp
      # a test whose prerequisite (a fixture, the shim) is missing fails here
      # rather than skipping
      VFS_TEST_REQUIRE_ALL: '1'
    steps:
      - uses: actions/checkout@v4
      # TMP/TEMP above only name it; nothing creates it
      - name: Create an 8.3-free TMP
        run: New-Item -ItemType Directory -Force -Path C:\vfstmp | Out-Null
        shell: pwsh
      # rust-toolchain.toml's pinned toolchain, with its targets (i686 for the
      # 32-bit injector) and components
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ env.SAVE_LARGE_CACHES == 'true' }}
      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check
      # `--all-targets` is what covers tests, benches and the cdylibs
      - name: Clippy (workspace, all targets, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      # The shim and fixtures beside the test profile, so the tests that
      # inject them need no nested cargo build. staticimp links
      # `vproxy.dll.lib` through its build.rs with no Cargo edge to the cdylib
      # (cargo#6313), so on a clean target dir vproxy must be built first or
      # the link fails with LNK1181. Hence two builds, in this order.
      - name: Build inject artifacts
        run: cargo build -p aether-inject -p aether-shim -p aether-fixtures -p aether-fixture-vproxy -p aether-shimbench && cargo build -p aether-fixture-staticimp
      # `--no-fail-fast`: without it cargo stops at the first failing test
      # binary and hides how much of the suite broke. No `-p`: every member.
      # This is also the counted-cost gate: aether-hooks' `harness` binary
      # checks each hooked call's round trips, ring bytes and allocations
      # against crates/aether-hooks/tests/harness/costs.txt (a few seconds, in
      # this run, not a step of its own). A count that went down passes with
      # a notice naming the command that lowers the record.
      - name: Rust tests (every crate)
        timeout-minutes: 25
        run: cargo test --no-fail-fast
      # The shim's cost per Win32 call (aether-shimbench), as a smoke run:
      # every case natively and in a process the injector started with the
      # shim, 10 calls each, in a few seconds. The timings are a shared
      # runner's and nothing compares them; the requests per call are
      # checked against costs.txt by the crate's tests in the step above,
      # which is why this run (like those tests) asks for the shim tests'
      # geometry rather than the default production one.
      - name: Shim benchmark (smoke)
        timeout-minutes: 5
        run: target/debug/aether-shimbench --geometry shim-tests --iterations 10 --out target/bench/shim-smoke.json
      # What every director must do (contract/scenarios), the malformed
      # requests, 1024 generated cases compared with the reference, and 256
      # rounds of 4 clients at once (docs/conformance.md), played against the
      # reference director over a ring file and over a named section, and
      # (without the concurrent rounds) over a ring with no bulk arena. The
      # seed is the run's id, so a failure replays with --seed; the shrunk
      # case (or failing round) is uploaded.
      - name: Director conformance (reference, file ring and section)
        # A few minutes measured (docs/conformance.md); generous headroom.
        timeout-minutes: 15
        shell: bash
        run: |
          cargo build -p aether-conform
          target/debug/aether-conform run --director "target/debug/aether-conform reference-adapter" --scenarios contract/scenarios --malformed --limits --generate --cases 1024 --concurrent 4 --concurrent-cases 256 --seed ${{ github.run_id }} --failures target/conform-failures
          target/debug/aether-conform run --director "target/debug/aether-conform reference-adapter --ring section" --scenarios contract/scenarios --malformed --limits --generate --cases 1024 --concurrent 4 --concurrent-cases 256 --seed ${{ github.run_id }} --failures target/conform-failures
          target/debug/aether-conform run --director "target/debug/aether-conform reference-adapter --no-arena" --scenarios contract/scenarios --malformed --limits --generate --cases 256 --seed ${{ github.run_id }} --failures target/conform-failures
      # aether-conform bench, --quick: every workload but sequential-bulk
      # (a 256 MiB tree, slow to build in a debug build) mounted and played
      # once, a few requests per thread, against the reference and the null
      # adapter's floor. It fails only on replies and counts: timed numbers
      # never fail CI (docs/conformance.md, "Benchmarks"). About 6 s measured.
      - name: Director benchmark (smoke)
        timeout-minutes: 5
        run: target/debug/aether-conform bench --director "target/debug/aether-conform reference-adapter" --workloads contract/workloads --only launch-storm,random-small,readdir-large,save-heavy --quick --out target/bench/conform-smoke.json
      - name: Conformance failures (shrunk generated cases)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conform-failures-windows
          path: target/conform-failures
          if-no-files-found: ignore
      # A 32-bit (WOW64) process lays its parameter block and environment out
      # differently from an x64 one, and the injector rewrites both; its unit
      # tests run 32-bit targets only when built for i686.
      - name: aether-inject unit tests, 32-bit (i686)
        run: cargo test -p aether-inject --lib --target i686-pc-windows-msvc
      # The release natives (+crt-static, x64 and i686) and the fixtures, as a
      # release builds them, with the VC++ runtime import check required
      - name: Release natives and fixtures (bin/build-natives.ps1)
        shell: powershell
        run: .\bin\build-natives.ps1 -Fixtures -RequireDumpbin
      - name: Natives key
        shell: powershell
        run: |
          Write-Host "natives key: $(.\bin\natives-key.ps1)"
      # release.yml's scripts, against fake tools: no secrets, no network
      - name: Signing and reuse scripts (self-tests)
        shell: powershell
        run: |
          .\bin\sign.tests.ps1
          if ($LASTEXITCODE) { throw 'sign.tests.ps1 failed' }
          .\bin\reuse-natives.tests.ps1
          if ($LASTEXITCODE) { throw 'reuse-natives.tests.ps1 failed' }
          .\bin\natives-key.tests.ps1
          if ($LASTEXITCODE) { throw 'natives-key.tests.ps1 failed' }

  # The crates that build on Linux (format, lint of the `#[cfg(unix)]` half
  # that nothing else compiles, their tests), then the cross-build of the
  # Windows natives and fixtures with cargo-xwin.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Every crate that builds on Linux. The rest (aether-hooks, aether-shim,
      # aether-inject, aether-win, aether-fixture*) pull Windows-only code (`retour`,
      # Win32) and are linted and tested by the windows job.
      LINUX_CRATES: >-
        -p aether-ipc -p aether-protocol -p aether-casefold -p aether-pe
        -p aether-env -p aether-registry -p aether-testkit
        -p aether-ntlayout -p aether-redirect -p aether-filering
        -p aether-rpc -p aether-refdirector -p aether-conform -p aether-fuzz
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # fuzz/ builds into a target folder of its own (its own workspace).
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ env.SAVE_LARGE_CACHES == 'true' }}
          workspaces: |
            . -> target
            fuzz -> target
      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check
      # fuzz/ is outside the workspace (nightly, libfuzzer), so --all does not
      # see it. Its targets are checked on the stable toolchain here, so they
      # cannot rot between the weekly runs (fuzz.yml); the bodies they call run
      # in the test step below (aether-fuzz's replay).
      - name: Format and check the fuzz targets
        run: |
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo check --locked --manifest-path fuzz/Cargo.toml
      - name: Clippy (Linux crates, all targets, warnings are errors)
        run: cargo clippy $LINUX_CRATES --all-targets -- -D warnings
      - name: Portable crates (compile and test on Linux)
        run: cargo test --no-fail-fast $LINUX_CRATES
      # What every director must do (contract/scenarios), the malformed
      # requests, 1024 generated cases compared with the reference, and 256
      # rounds of 4 clients at once (docs/conformance.md), played against the
      # reference director over a ring file. The seed is the run's id; the
      # shrunk case (or failing round) is uploaded.
      - name: Director conformance (reference, file ring)
        # About two minutes measured (docs/conformance.md); generous headroom.
        timeout-minutes: 15
        run: |
          cargo build -p aether-conform
          target/debug/aether-conform run --director "target/debug/aether-conform reference-adapter" --scenarios contract/scenarios --malformed --limits --generate --cases 1024 --concurrent 4 --concurrent-cases 256 --seed ${{ github.run_id }} --failures target/conform-failures
      # aether-conform bench, --quick: every workload but sequential-bulk
      # (a 256 MiB tree, slow to build in a debug build) mounted and played
      # once, a few requests per thread, against the reference and the null
      # adapter's floor. It fails only on replies and counts: timed numbers
      # never fail CI (docs/conformance.md, "Benchmarks"). About 6 s measured.
      - name: Director benchmark (smoke)
        timeout-minutes: 5
        run: target/debug/aether-conform bench --director "target/debug/aether-conform reference-adapter" --workloads contract/workloads --only launch-storm,random-small,readdir-large,save-heavy --quick --out target/bench/conform-smoke.json
      - name: Conformance failures (shrunk generated cases)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conform-failures-linux
          path: target/conform-failures
          if-no-files-found: ignore
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      # LLVM 19 (the runner's default 18 can't link the i686 shim), its
      # unversioned names first on PATH
      - name: LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
      # The MSVC CRT + Windows SDK cargo-xwin downloads on first use (about
      # 15 minutes when Microsoft's servers are slow).
      - name: cargo-xwin's MSVC CRT from the cache
        id: xwin
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - name: Cross-build the natives and fixtures (bin/build-windows --release)
        run: bin/build-windows --release
      - name: cargo-xwin's MSVC CRT into the cache (master)
        if: env.SAVE_LARGE_CACHES == 'true' && steps.xwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - name: The four natives are staged
        run: |
          for f in aether-injector.exe aether_shim.dll aether-injector32.exe aether_shim32.dll; do
            test -f "target/natives/$f" || { echo "target/natives/$f missing"; exit 1; }
          done
          ls -l target/natives
