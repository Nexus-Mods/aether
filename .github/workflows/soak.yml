# Long generated runs, off the main CI: the conformance generator and the
# shim's fault properties with fresh seeds for a stretch of time, nightly and
# by hand. Never part of ci.yml, and never on a push or a pull request. A
# failure is shrunk, written as a scenario file (or a seed and a sequence for
# the shim) and uploaded, and the job summary lists the command that replays
# each one locally. docs/conformance.md, "Soak runs", is the guide.
name: soak

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Minutes each job runs (conformance and shim faults)
        default: '120'
      director:
        description: reference, or an adapter command line run from the repository root (conformance only)
        default: reference
      seed:
        description: First seed (empty for one from the clock)
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # A run on a schedule has no inputs.
  DURATION: ${{ inputs.duration || '120' }}
  DIRECTOR: ${{ inputs.director || 'reference' }}
  SEED: ${{ inputs.seed }}

jobs:
  # A job's timeout is a number in the job's own definition, and an
  # expression cannot add: it is worked out here, the run's minutes and 45
  # more for the build and for shrinking a failure found at the end. A job on
  # a hosted runner may run 360 minutes.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      timeout: ${{ steps.timeout.outputs.minutes }}
    steps:
      - id: timeout
        run: |
          case "$DURATION" in
            ''|*[!0-9]*) echo "duration must be a whole number of minutes, not '$DURATION'" >&2; exit 1 ;;
          esac
          if [ "$DURATION" -lt 1 ] || [ "$DURATION" -gt 300 ]; then
            echo "duration must be 1 to 300 minutes, not $DURATION" >&2
            exit 1
          fi
          echo "minutes=$((DURATION + 45))" >> "$GITHUB_OUTPUT"

  # The generated cases, the concurrent rounds, the malformed requests and
  # the limits against the reference adapter, over a ring file on both
  # systems and a named section on Windows.
  conformance:
    name: conformance (${{ matrix.os }}, ${{ matrix.ring }} ring)
    runs-on: ${{ matrix.os }}
    needs: plan
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ring: file
          - os: windows-latest
            ring: file
          - os: windows-latest
            ring: section
    env:
      TMP: ${{ matrix.os == 'windows-latest' && 'C:\vfstmp' || '' }}
      TEMP: ${{ matrix.os == 'windows-latest' && 'C:\vfstmp' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Create an 8.3-free TMP
        if: matrix.os == 'windows-latest'
        run: New-Item -ItemType Directory -Force -Path C:\vfstmp | Out-Null
        shell: pwsh
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - name: Build aether-conform
        run: cargo build --release -p aether-conform
      # The soak ends with exit code 1 when it found a failure; the steps
      # after it still run.
      - name: Soak
        run: |
          mkdir -p target/soak
          if [ "$DIRECTOR" = reference ]; then
            director="target/release/aether-conform reference-adapter --ring ${{ matrix.ring }}"
          else
            director="$DIRECTOR"
          fi
          seed=()
          if [ -n "$SEED" ]; then seed=(--seed "$SEED"); fi
          target/release/aether-conform soak --director "$director" --scenarios contract/scenarios --for "${DURATION}m" "${seed[@]}" --failures target/soak/failures --summary target/soak/summary.json
      - name: Failures in the job summary
        if: failure()
        run: |
          [ -f target/soak/summary.json ] || { echo 'The soak ended without a summary.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo '### Soak failures: ${{ matrix.os }}, ${{ matrix.ring }} ring'
            echo
            jq -r '"\(.cases) cases, \(.rounds) rounds, \(.batches) batches, \(.distinct_failures) distinct failure(s), \(.wall_seconds) s"' target/soak/summary.json
            echo
            jq -r '.failures[] | "- `\(.id)` (\(.kind), \(.class), seen \(.occurrences) time(s), seed \(.seed))\n\n  ```\n  \(.replay)\n  ```"' target/soak/summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-conformance-${{ matrix.os }}-${{ matrix.ring }}
          path: target/soak
          if-no-files-found: ignore

  # The shim's generated fault properties (aether-hooks, tests/harness/
  # faults_file.rs and faults_registry.rs) with fresh seeds. Windows only:
  # that is where the shim runs.
  shim-faults:
    runs-on: windows-latest
    needs: plan
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    env:
      TMP: C:\vfstmp
      TEMP: C:\vfstmp
      VFS_TEST_REQUIRE_ALL: '1'
      AETHER_FAULTS_SOAK: ${{ inputs.duration || '120' }}m
      AETHER_FAULTS_FAILURES: target/soak/faults
    steps:
      - uses: actions/checkout@v4
      - name: Create an 8.3-free TMP
        run: New-Item -ItemType Directory -Force -Path C:\vfstmp | Out-Null
        shell: pwsh
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: false
      - name: Set the first seed
        if: inputs.seed != ''
        run: echo "AETHER_FAULTS_SEED=${{ inputs.seed }}" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Soak
        run: cargo test -p aether-hooks --test harness soak_ -- --ignored --nocapture
      - name: Failures in the job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Shim fault soak failures'
            echo
            for f in target/soak/faults/*.txt; do
              [ -f "$f" ] || continue
              echo "- \`$(basename "$f")\`"
              echo
              echo '  ```'
              head -n 3 "$f" | sed 's/^/  /'
              echo '  ```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-shim-faults
          path: target/soak/faults
          if-no-files-found: ignore
