[workspace]
resolver = "2"
# cargo-fuzz's crate: nightly, its own lockfile (fuzz/Cargo.toml).
exclude = ["fuzz"]
members = [
  # The case fold every name crosses the ring in, shared by file paths
  # (aether-redirect) and registry keys (aether-registry). No dependencies.
  "crates/aether-casefold",
  # Pure PE byte parsing, so a director can stage Windows executables on any
  # host OS. No OS API and no dependencies: a PE is a file format, not a
  # platform.
  "crates/aether-pe",
  "crates/aether-env",
  "crates/aether-protocol",
  # Dev-only helpers shared by integration tests (stored-zip writer, artefact locator).
  "crates/aether-testkit",
  # Registry overlay model (paths, copy-on-write tree). Portable: depends only on
  # aether-casefold.
  "crates/aether-registry",
  "crates/aether-ipc",
  # A ring in a memory-mapped file (aether_ipc::RingBacking), for native tools on any OS.
  "crates/aether-filering",
  # The ring's typed ends: a Client (the shim's) and a Director trait with serve
  # (every Rust-side server's), over aether-protocol's table.
  "crates/aether-rpc",
  # The reference director (an in-memory provider graph and registry overlay, the
  # shim tests' server and the conformance oracle) and a null director.
  "crates/aether-refdirector",
  # The conformance tool: scenarios (JSON) and the rules a director's replies
  # are compared with the reference's by. Portable.
  "crates/aether-conform",
  # The fuzz targets' bodies, replayed on stable in every CI run; fuzz/ (outside the
  # workspace) runs them under cargo-fuzz.
  "crates/aether-fuzz",
  "crates/aether-inject",
  # Pure NT byte layouts and decisions (directory records, dispositions, object names)
  # for the shim, split out so they build and test on any host.
  "crates/aether-ntlayout",
  "crates/aether-redirect",
  "crates/aether-hooks",
  "crates/aether-shim",
  "crates/aether-win",
  # The test fixtures: seven Windows programs the tests run under the shim
  # (aether-fixture-read, -writepath, -escape, -prefs, -registry, -steam,
  # -nvapi), and the library they share (waiting for a stats report that
  # covers the run).
  "crates/aether-fixtures",
  # vproxy.dll, a cdylib: its own package, since a package has one library
  # and aether-fixtures' is the rlib its bins share.
  "crates/aether-fixture-vproxy",
  # An exe that imports vproxy.dll statically: what a program's static
  # imports see while the loader initialises them, before its own code runs.
  # Its own package because its build.rs links vproxy.dll.lib, which only
  # exists once vproxy is built (in an earlier cargo invocation, cargo#6313).
  "crates/aether-fixture-staticimp",
  # What a Win32 call costs under the shim (aether-shimbench), natively and
  # injected. Windows only, a benchmark: not shipped, and not in
  # contract/artifacts.json.
  "crates/aether-shimbench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
# Floor the code needs: `File::try_lock` (1.89). CI builds with the toolchain pinned in rust-toolchain.toml.
rust-version = "1.89"
publish = false

# Unsafe is denied by default; a crate (or a test/bin root) that is FFI by
# nature says so with `#![allow(unsafe_code)]`, which makes the surface explicit.
# Not enabled yet because they need hundreds of edits in aether-hooks / aether-win /
# the fixtures: rust `unsafe_op_in_unsafe_fn` and clippy
# `undocumented_unsafe_blocks`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# Internal crates.
aether-casefold = { path = "crates/aether-casefold" }
aether-conform = { path = "crates/aether-conform" }
aether-env = { path = "crates/aether-env" }
aether-filering = { path = "crates/aether-filering" }
aether-hooks = { path = "crates/aether-hooks" }
aether-inject = { path = "crates/aether-inject" }
aether-ipc = { path = "crates/aether-ipc" }
aether-ntlayout = { path = "crates/aether-ntlayout" }
aether-pe = { path = "crates/aether-pe" }
aether-protocol = { path = "crates/aether-protocol" }
aether-redirect = { path = "crates/aether-redirect" }
aether-refdirector = { path = "crates/aether-refdirector" }
aether-registry = { path = "crates/aether-registry" }
aether-rpc = { path = "crates/aether-rpc" }
aether-testkit = { path = "crates/aether-testkit" }
aether-win = { path = "crates/aether-win" }

# Shared external crates: one version spec each. Members add their own
# `features` / `optional` on top.
tempfile = "3.27"
memmap2 = "0.9"
# Scenario files (aether-conform; aether-refdirector's `scenario` feature).
serde = "1"
serde_json = "1"
windows-sys = "0.61"
# Flag words of the wire protocol (aether-protocol: OpenFlags, RequestFlags).
bitflags = "2"
# Generative tests of the wire codecs (aether-protocol, its `testing` feature).
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Micro-benchmarks (benches/ of five crates, dev-dependency only). No plots: the
# HTML reports would pull in plotters for nothing a terminal does not say.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Latency histograms of `aether-conform bench`. No serialisation formats: the
# report is JSON of quantiles, not histogram logs.
hdrhistogram = { version = "7.5", default-features = false }

# Everything here unwinds so the library can catch panics at FFI boundaries
# instead of killing its host process.
[profile.dev]
panic = "unwind"

# Third-party code (retour, its disassembler, ...) optimised even in debug builds, so
# debug tests and the debug Proton e2e run near release speed. Workspace crates
# stay at opt-level 0 for debuggability. Optimisation only, no behaviour change.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "unwind"
# Line tables only: Wine crash reports and core dumps symbolise, with no change
# to the generated code.
debug = "line-tables-only"

# The four shipped natives (bin/build-natives.ps1, bin/build-windows --release):
# release with whole-program LTO in one codegen unit, about 4-5% smaller at the
# same speed per call. A profile of its own because `lto` cannot be set per
# package, and the tests, fixtures and tools gain nothing from the longer build.
# Not named `natives`: its host output folder would be target/natives, where
# the natives are staged.
[profile.natives-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[patch.crates-io]
# retour 0.3.1 (the latest release) with its "win64" hooks limited to x86-64,
# so the shim builds for i686: see vendor/retour/src/macros.rs.
retour = { path = "vendor/retour" }
