[package]
name = "aether-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aether-redirect.workspace = true
# Pure NT layouts and decisions the hooks apply.
aether-ntlayout.workspace = true
# The fold vpath components cross the ring in.
aether-casefold.workspace = true
aether-protocol.workspace = true
aether-ipc.workspace = true
# The typed client the shim sends its requests through.
aether-rpc.workspace = true
aether-win.workspace = true
# Dual-layer vehicle (reflective map + RIP-redirect + spin gate) for children.
aether-env.workspace = true
aether-inject.workspace = true
# Names of the on-disk copies backing image sections.
aether-pe.workspace = true
# `Lookup`, `Node` and `fold` for the registry client (`regclient.rs`).
aether-registry.workspace = true
retour = { version = "0.3", default-features = false }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_Storage_FileSystem",
] }

[features]
# Entry points for this crate's own tests (`director::install_global`,
# `director::connect_from_env`). Off in the shipped shim: only the
# dev-dependency below turns it on.
test-support = []

[dev-dependencies]
# The crate's own tests use the `test-support` entry points.
aether-hooks = { path = ".", features = ["test-support"] }
# The director the shim's tests serve (`tests/fakedirector`); its serve loop is
# `aether-rpc`'s, a normal dependency above.
aether-refdirector.workspace = true
# `tests/fakedirector`'s file ring (`RingKind::File`).
aether-filering.workspace = true
# The counting allocator (`tests/harness`) and temp folders.
aether-testkit.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  # `tests/registry/regkeys*.rs`: scratch real keys, a restrictive DACL, the user SID.
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  # `tests/registry/regnotify.rs`: ntdll calls looked up at run time.
  "Win32_System_LibraryLoader",
  # `tests/diagnostics/child_inject_fails_closed.rs`: the process list.
  "Win32_System_Diagnostics_ToolHelp",
] }

[lints]
workspace = true
