[package]
name = "aether-redirect"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The fold every vpath component goes through before it crosses the ring.
aether-casefold.workspace = true
# `RootId` only: the wire's root type, which a multi-root `RootMap` answers with.
aether-protocol.workspace = true
# Raw Win32 volume/path lookups (QueryDosDeviceW, GetVolumeNameForVolumeMountPointW,
# GetLongPathNameW, GetFinalPathNameByHandleW) live in aether-win, not here: this crate
# is `#![forbid(unsafe_code)]`, and aether-win is the existing home for confined FFI.
aether-win.workspace = true

[lints]
workspace = true
