[package]
name = "aether-refdirector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The fold names are matched by (docs/wire.md 3.2).
aether-casefold.workspace = true
aether-ipc.workspace = true
aether-protocol.workspace = true
# The registry overlay the registry opcodes are answered from.
aether-registry.workspace = true
aether-rpc.workspace = true
# `Tree` deserialises from a scenario file with the `scenario` feature.
serde = { workspace = true, features = ["derive"], optional = true }

[features]
# `Deserialize` for `tree::Tree`, for aether-conform's scenario loader.
scenario = ["dep:serde"]

[lints]
workspace = true
