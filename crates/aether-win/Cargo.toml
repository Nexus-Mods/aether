[dependencies]
aether-env.workspace = true
aether-ipc.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  # `KillOnCloseJob`: the job, and resuming a process created suspended in it.
